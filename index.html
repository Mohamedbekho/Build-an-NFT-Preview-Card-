<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | NFT preview card component</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
  <main class="container">
    <div class="box">
      <div class="image">
  <img src="images/image-equilibrium.jpg" alt="Equilibrium NFT" class="main-img">
  <div class="overlay">
    <img src="images/icon-view.svg" alt="View icon">
  </div>
</div>
      <h3>Equilibrium #3429</h3>
      <p>Our Equilibrium collection promotes balance and calm.</p>
      <div class="info">
        <div class="price">
          <img src="images/icon-ethereum.svg" alt="Ethereum">
          <span>0.041 ETH</span>
        </div>
        <div class="time">
          <img src="images/icon-clock.svg" alt="Clock">
          <span>3 days left</span>
        </div>
      </div>
      <div class="creator">
        <img src="images/image-avatar.png" alt="Jules Wyvern">
        <p><span>Creation of</span> Jules Wyvern</p>
      </div>
    </div>
  </main>
</body>
</html>
